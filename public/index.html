<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вітальна листівка</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #a8edd9 0%, #fed6e3 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }
        .card-box {
            background: #ffffff;
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            max-width: 500px;
            width: 100%;
            text-align: center;
        }
        h1 { color: #333; margin-bottom: 20px; }
        input {
            width: 90%;
            padding: 12px;
            margin: 8px 0;
            border: 2px solid #ddd;
            border-radius: 8px;
            font-size: 16px;
            outline: none;
        }
        input:focus { border-color: #4CAF50; }
        button {
            background-color: #4CAF50;
            color: white;
            padding: 12px 24px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
            margin-top: 10px;
            transition: background 0.2s;
        }
        button:hover { background-color: #45a049; }
        button:disabled { background-color: #cccccc; cursor: not-allowed; }
        
        .postcard-view {
            display: none;
            margin-top: 25px;
            padding: 20px;
            background: #fff8e7;
            border: 2px dashed #ffa726;
            border-radius: 12px;
            min-height: 150px;
            position: relative;
        }
        .page-text {
            font-size: 20px;
            color: #444;
            line-height: 1.6;
            margin-bottom: 20px;
            white-space: pre-wrap;
        }
        .controls {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 15px;
        }
        .indicator { font-weight: bold; color: #666; }
    </style>
</head>
<body>

<div class="card-box">
    <h1>Отримати листівку 🎁</h1>
    
    <div id="loginForm">
        <input type="text" id="userName" placeholder="Введіть ваше ім'я">
        <input type="text" id="userCode" placeholder="Секретний 4-значний код" maxlength="4">
        <br>
        <button onclick="getCard()">Відкрити листівку</button>
    </div>

    <div id="postcardArea" class="postcard-view">
        <div id="pageText" class="page-text"></div>
        
        <div id="navControls" class="controls" style="display: none;">
            <button id="prevBtn" onclick="prevPage()">⬅️ Назад</button>
            <span id="pageIndicator" class="indicator">1 / 1</span>
            <button id="nextBtn" onclick="nextPage()">Вперед ➡️</button>
        </div>
    </div>
</div>

<script>
    let pages = [];
    let currentPage = 0;

    async function getCard() {
        const name = document.getElementById('userName').value.trim();
        const code = document.getElementById('userCode').value.trim();

        if (!name || !code) {
            alert("Будь ласка, введіть ім'я та код!");
            return;
        }

        try {
            const response = await fetch('/api/get-card', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ name, code })
            });

            const data = await response.json();

            if (data.success) {
                pages = data.pages;
                currentPage = 0;
                document.getElementById('loginForm').style.display = 'none';
                document.getElementById('postcardArea').style.display = 'block';
                renderPage();
            } else {
                alert(data.message);
            }
        } catch (err) {
            alert("Помилка підключення до сервера!");
        }
    }

    function renderPage() {
        document.getElementById('pageText').innerText = pages[currentPage];
        document.getElementById('pageIndicator').innerText = `${currentPage + 1} з ${pages.length}`;

        const navControls = document.getElementById('navControls');
        if (pages.length > 1) {
            navControls.style.display = 'flex';
            document.getElementById('prevBtn').disabled = (currentPage === 0);
            document.getElementById('nextBtn').disabled = (currentPage === pages.length - 1);
        } else {
            navControls.style.display = 'none';
        }
    }

    function nextPage() {
        if (currentPage < pages.length - 1) {
            currentPage++;
            renderPage();
        }
    }

    function prevPage() {
        if (currentPage > 0) {
            currentPage--;
            renderPage();
        }
    }
</script>

</body>
</html>
